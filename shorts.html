<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CongoFlix Shorts</title>
  
  <!-- Swiper.js CSS (Pour le défilement vertical style TikTok) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
  <!-- FontAwesome pour les icônes (Like, Share, Sound) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      background-color: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      color: #fff;
    }

    /* Container principal Swiper */
    .swiper {
      width: 100%;
      height: 100vh;
      max-width: 480px; /* Taille optimale style smartphone */
      margin: 0 auto;
      background: #000;
    }

    .swiper-slide {
      position: relative;
      width: 100%;
      height: 100%;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* Conteneur de l'iframe vidéo */
    .video-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      border: none;
      pointer-events: auto;
    }

    .video-container iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Overlay d'informations (Titre, Auteur) */
    .video-info {
      position: absolute;
      bottom: 20px;
      left: 15px;
      right: 80px;
      z-index: 10;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
    }

    .video-info .author {
      font-weight: 700;
      font-size: 16px;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .video-info .author i {
      color: #00f2fe;
      font-size: 14px;
    }

    .video-info .title {
      font-size: 14px;
      line-height: 1.3;
      color: #efefef;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* Actions latérales style TikTok (Like, Share, etc.) */
    .side-actions {
      position: absolute;
      right: 12px;
      bottom: 30px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }

    .action-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: none;
      border: none;
      color: #fff;
      cursor: pointer;
    }

    .action-btn .icon-box {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(8px);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 20px;
      margin-bottom: 4px;
      transition: transform 0.2s, color 0.2s;
    }

    .action-btn:active .icon-box {
      transform: scale(0.85);
    }

    .action-btn.liked .icon-box i {
      color: #ff2b54;
    }

    .action-btn span {
      font-size: 11px;
      font-weight: 600;
    }

    /* Carte de Publicité (Adsterra / ExoClick) */
    .ad-card {
      width: 90%;
      height: 80%;
      background: #111;
      border: 1px solid #ffd700;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      text-align: center;
      box-shadow: 0 0 20px rgba(255, 215, 0, 0.2);
    }

    .ad-tag {
      background: #ffd700;
      color: #000;
      font-size: 10px;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 4px;
      margin-bottom: 15px;
      text-transform: uppercase;
    }

    /* Écran de chargement */
    #loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 99;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(255, 255, 255, 0.1);
      border-top-color: #ff2b54;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 15px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <!-- Écran de chargement initial -->
  <div id="loading-screen">
    <div class="spinner"></div>
    <p style="font-size: 14px; color: #aaa;">Chargement de CongoFlix...</p>
  </div>

  <!-- Conteneur principal du flux vertical -->
  <div class="swiper mySwiper">
    <div class="swiper-wrapper" id="feed-container">
      <!-- Les diapositives seront injectées ici dynamiquement par JS -->
    </div>
  </div>

  <!-- Swiper.js JS -->
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

  <script>
    // L'URL de ton Worker Cloudflare (Injectée directement d'après ta capture)
    const CLOUDFLARE_WORKER_URL = 'https://congoflix.jokajoko141.workers.dev';

    let swiperInstance = null;

    // Initialisation du carrousel Swiper (Mode TikTok)
    function initSwiper() {
      swiperInstance = new Swiper(".mySwiper", {
        direction: "vertical",
        slidesPerView: 1,
        spaceBetween: 0,
        mousewheel: true,
        keyboard: true,
      });
    }

    // Gestion du bouton Like
    function toggleLike(button) {
      button.classList.toggle('liked');
      const countSpan = button.querySelector('.like-count');
      let currentLikes = parseInt(countSpan.innerText);
      if (button.classList.contains('liked')) {
        countSpan.innerText = currentLikes + 1;
      } else {
        countSpan.innerText = currentLikes - 1;
      }
    }

    // Fonction de partage
    function shareVideo(title, url) {
      if (navigator.share) {
        navigator.share({
          title: 'CongoFlix Short',
          text: title,
          url: url,
        });
      } else {
        navigator.clipboard.writeText(url);
        alert('Lien de la vidéo copié !');
      }
    }

    // Charger le flux vidéo depuis Cloudflare
    async function chargerFluxVideos() {
      const container = document.getElementById('feed-container');
      const loadingScreen = document.getElementById('loading-screen');

      try {
        const response = await fetch(`${CLOUDFLARE_WORKER_URL}?q=gaming`);
        const result = await response.json();

        if (result.status === "success" && result.data.length > 0) {
          loadingScreen.style.display = 'none';

          result.data.forEach((video, index) => {
            const likesSimules = Math.floor(Math.random() * 800) + 120;
            
            // 1. Ajouter la carte Vidéo TikTok
            const videoSlide = document.createElement('div');
            videoSlide.className = 'swiper-slide';
            videoSlide.innerHTML = `
              <div class="video-container">
                <iframe 
                  src="${video.stream_url}" 
                  allow="autoplay; encrypted-media" 
                  allowfullscreen>
                </iframe>
              </div>

              <div class="video-info">
                <div class="author">@CongoFlix <i class="fa-solid fa-circle-check"></i></div>
                <div class="title">${video.title}</div>
              </div>

              <div class="side-actions">
                <button class="action-btn" onclick="toggleLike(this)">
                  <div class="icon-box"><i class="fa-solid fa-heart"></i></div>
                  <span class="like-count">${likesSimules}</span>
                </button>

                <button class="action-btn" onclick="shareVideo('${video.title}', '${video.stream_url}')">
                  <div class="icon-box"><i class="fa-solid fa-share"></i></div>
                  <span>Partager</span>
                </button>
              </div>
            `;
            container.appendChild(videoSlide);

            // 2. TOUTES LES 3 VIDÉOS : On injecte TA CARTE PUB
            if ((index + 1) % 3 === 0) {
              const adSlide = document.createElement('div');
              adSlide.className = 'swiper-slide';
              adSlide.innerHTML = `
                <div class="ad-card">
                  <span class="ad-tag">Sponsorisé</span>
                  <h3 style="color:#fff; font-size:16px; margin-bottom:10px;">Espace Publicitaire CongoFlix</h3>
                  <p style="color:#aaa; font-size:12px; margin-bottom:15px;">Place ton script de régie publicitaire (Adsterra / ExoClick) ici.</p>
                  
                  <!-- REMPLACE CE BLOC PAR TON CODE ADSTERRA / EXOCLICK -->
                  <div id="adsterra-banner-container" style="width:100%; min-height:150px; background:#222; border-radius:8px; display:flex; justify-content:center; align-items:center;">
                     <span style="color:#ffd700; font-size:12px;">[ Bannière Pub Rémunérée ]</span>
                  </div>
                </div>
              `;
              container.appendChild(adSlide);
            }
          });

          // Lancer Swiper une fois le contenu généré
          initSwiper();

        } else {
          loadingScreen.innerHTML = "<p style='color:#fff;'>Aucune vidéo disponible.</p>";
        }

      } catch (error) {
        console.error("Erreur de connexion avec Cloudflare :", error);
        loadingScreen.innerHTML = "<p style='color:#ff2b54;'>Erreur de chargement du flux.</p>";
      }
    }

    // Charger les vidéos au démarrage
    window.onload = chargerFluxVideos;
  </script>
</body>
</html>

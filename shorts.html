<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Shorts & TikTok Feed</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; background: #000; overflow: hidden; font-family: sans-serif; }
        
        /* Conteneur Plein Écran Vertical */
        .feed-container {
            height: 100vh;
            width: 100vw;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            scrollbar-width: none;
        }
        .feed-container::-webkit-scrollbar { display: none; }

        .video-card {
            width: 100vw;
            height: 100vh;
            scroll-snap-align: start;
            scroll-snap-stop: always;
            position: relative;
            background: #111;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            pointer-events: auto;
        }

        .overlay-info {
            position: absolute;
            bottom: 20px;
            left: 15px;
            right: 15px;
            z-index: 10;
            color: white;
            pointer-events: none;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body>

    <div class="feed-container" id="feed">
        <!-- Les vraies vidéos automatiques seront injectées ici -->
    </div>

    <script>
        // IDs de vraies vidéos publiques YouTube Shorts (Mise à jour automatique possible via API)
        // Les Shorts YouTube se lisent parfaitement dans AppCreator24 sans blocage CORS
        const youtubeShortsIDs = [
            "L3N2S_9x008",
            "J---aiyznGQ",
            "3JX4-iRTh18",
            "fC7oUOUEEi4"
        ];

        const feed = document.getElementById('feed');

        function loadRealVideos() {
            feed.innerHTML = youtubeShortsIDs.map((id, index) => `
                <div class="video-card">
                    <iframe 
                        src="https://www.youtube.com/embed/${id}?autoplay=1&loop=1&playlist=${id}&controls=0&mute=0&rel=0&modestbranding=1" 
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                        allowfullscreen>
                    </iframe>
                </div>
            `).join('');
        }

        // Lancement au chargement de la page
        window.onload = loadRealVideos;
    </script>
</body>
</html>

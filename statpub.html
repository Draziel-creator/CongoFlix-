<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>PUBLICITÉ - Statistiques</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            font-family: 'Inter', sans-serif; background-color: #050508; color: #ffffff;
            overflow: hidden; display: flex; justify-content: center; align-items: center;
        }

        .app-container {
            width: 100%; height: 100%; max-width: 450px;
            background: linear-gradient(135deg, #060713 0%, #020308 100%);
            position: relative; display: flex; flex-direction: column;
            box-shadow: 0 0 40px rgba(0,0,0,0.8);
        }

        /* TOP HEADER */
        .stats-header {
            padding: 25px 20px 15px 20px;
            display: flex; align-items: center; justify-content: space-between;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        .btn-back {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #ffffff; width: 36px; height: 36px;
            border-radius: 50%; display: flex; justify-content: center; align-items: center;
            cursor: pointer; text-decoration: none; font-size: 14px;
        }
        .header-title { font-size: 18px; font-weight: 700; margin: 0; letter-spacing: -0.3px; }
        .header-spacer { width: 36px; }

        /* CORPS DEFILLANT */
        .scrollable-content {
            flex: 1; overflow-y: auto; padding: 20px; box-sizing: border-box;
        }
        .scrollable-content::-webkit-scrollbar { display: none; }

        /* GRILLE KPIs */
        .stats-grid {
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 25px;
        }
        .kpi-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px; padding: 16px; position: relative;
        }
        .kpi-icon { position: absolute; top: 16px; right: 16px; font-size: 16px; color: #555875; }
        .kpi-icon.coins { color: #ffcc00; }
        .kpi-label { font-size: 12px; color: #8e92bc; margin: 0 0 6px 0; }
        .kpi-value { font-size: 19px; font-weight: 700; margin: 0 0 6px 0; color: #ffffff; }
        .kpi-value.neon { color: #00ffcc; }
        .kpi-value.gold { color: #ffcc00; }
        .kpi-trend { font-size: 11px; font-weight: 600; display: flex; align-items: center; gap: 4px; }
        .trend-up { color: #00ff66; }
        .trend-neutral { color: #b3b6d4; }
        .trend-down { color: #ff3b30; }

        /* SECTION GRAPHIQUE */
        .chart-section {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 20px; padding: 20px; margin-bottom: 25px;
        }
        .section-heading {
            font-size: 14px; font-weight: 600; text-transform: uppercase;
            letter-spacing: 0.5px; color: #9b51e0; margin: 0 0 15px 0;
            display: flex; justify-content: space-between; align-items: center;
        }
        .time-filter {
            font-size: 11px; background: rgba(155, 81, 224, 0.15);
            color: #cca3ff; padding: 4px 10px; border-radius: 12px; font-weight: 700;
        }

        /* HISTORIQUE */
        .history-list { display: flex; flex-direction: column; gap: 10px; }
        .history-item {
            background: rgba(255, 255, 255, 0.01);
            border: 1px solid rgba(255, 255, 255, 0.03);
            border-radius: 14px; padding: 12px 16px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .history-left { display: flex; align-items: center; gap: 12px; }
        .icon-wrapper {
            width: 36px; height: 36px; border-radius: 10px;
            background: rgba(0, 85, 255, 0.1); color: #0055ff;
            display: flex; justify-content: center; align-items: center; font-size: 14px;
        }
        .icon-wrapper.success { background: rgba(0, 255, 204, 0.1); color: #00ffcc; }
        .history-meta h4 { margin: 0 0 2px 0; font-size: 13px; font-weight: 600; }
        .history-meta span { font-size: 11px; color: #6e729a; }
        .history-right { text-align: right; }
        .history-amount { font-size: 14px; font-weight: 700; color: #00ffcc; margin-bottom: 2px; }
        .history-coins { font-size: 11px; color: #ffcc00; font-weight: 500; }

        /* NAV BAR */
        .nav-bar {
            background: #03040b; border-top: 1px solid rgba(255,255,255,0.06);
            padding: 14px 20px 22px 20px; display: flex; justify-content: space-around; align-items: center;
        }
        .nav-item {
            display: flex; flex-direction: column; align-items: center; gap: 6px;
            color: #555875; text-decoration: none; font-size: 11px; font-weight: 500; cursor: pointer;
            transition: color 0.2s;
        }
        .nav-item.active { color: #00ffcc; }
        .nav-icon { font-size: 20px; }
    </style>
</head>
<body>

    <div class="app-container">

        <header class="stats-header">
            <div class="btn-back" onclick="history.back()"><i class="fa-solid fa-chevron-left"></i></div>
            <h1 class="header-title">Analytique</h1>
            <div class="header-spacer"></div>
        </header>

        <div class="scrollable-content">
            
            <div class="stats-grid">
                <div class="kpi-card">
                    <i class="fa-solid fa-coins kpi-icon coins"></i>
                    <p class="kpi-label">Pièces du jour</p>
                    <p class="kpi-value gold" id="kpi-today-coins">0 Coins</p>
                    <div class="kpi-trend trend-up">
                        <i class="fa-solid fa-plus"></i> Aujourd'hui
                    </div>
                </div>

                <div class="kpi-card">
                    <i class="fa-solid fa-calculator kpi-icon"></i>
                    <p class="kpi-label">Valeur Taux</p>
                    <p class="kpi-value">100 = 0,50 €</p>
                    <div class="kpi-trend trend-neutral">
                        <i class="fa-solid fa-bolt" style="color: #ffcc00;"></i> Stable
                    </div>
                </div>

                <div class="kpi-card">
                    <i class="fa-solid fa-wallet kpi-icon"></i>
                    <p class="kpi-label">Gains Totaux</p>
                    <p class="kpi-value neon" id="kpi-total-earnings">0,00 €</p>
                    <div class="kpi-trend trend-up" id="kpi-coins-count">
                        <i class="fa-solid fa-coins"></i> 0 Coins
                    </div>
                </div>

                <div class="kpi-card">
                    <i class="fa-solid fa-eye kpi-icon"></i>
                    <p class="kpi-label">Pubs Vues</p>
                    <p class="kpi-value" id="kpi-tasks-completed">0</p>
                    <div class="kpi-trend trend-neutral">
                        <i class="fa-solid fa-check"></i> Total accompli
                    </div>
                </div>
            </div>

            <div class="chart-section">
                <h3 class="section-heading">Évolution de la semaine <span class="time-filter">7 derniers jours</span></h3>
                <div style="position: relative; height: 160px; width: 100%;">
                    <canvas id="earningsChart"></canvas>
                </div>
            </div>

            <div class="chart-section" style="padding-bottom: 10px;">
                <h3 class="section-heading">Flux récents</h3>
                <div class="history-list" id="history-container">
                    <div style="text-align:center; padding: 15px; color:#555875; font-size:12px;">Chargement des données...</div>
                </div>
            </div>

        </div>

        <nav class="nav-bar">
            <div class="nav-item" onclick="location.href='index.html'">
                <i class="fa-solid fa-house nav-icon"></i>
                <span>Accueil</span>
            </div>
            <div class="nav-item">
                <i class="fa-regular fa-comment-dots nav-icon"></i>
                <span>Messages</span>
            </div>
            <div class="nav-item active">
                <i class="fa-solid fa-chart-simple nav-icon"></i>
                <span>Stats</span>
            </div>
            <div class="nav-item">
                <i class="fa-solid fa-bolt nav-icon"></i>
                <span>Activités</span>
            </div>
        </nav>

    </div>

    <!-- SCRIPT FIREBASE & CHART SYNCHRONISATION -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { 
            apiKey: "AIzaSyBAL9enbjp1vnv7h6yariu_sWvUp5QeRVQ",
            authDomain: "publicite-6445c.firebaseapp.com",
            projectId: "publicite-6445c",
            storageBucket: "publicite-6445c.firebasestorage.app",
            messagingSenderId: "663385244466",
            appId: "1:663385244466:web:b72a95c96a8e2b8e6bcd2b", 
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // TAUX DE CONVERSION (100 coins = 0.50 € => 1 coin = 0.005 €)
        const RATE_PER_COIN = 0.005;

        // 1. INITIALISATION DU GRAPHIQUE CHART.JS
        const ctx = document.getElementById('earningsChart').getContext('2d');
        let earningsChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: ['...', '...', '...', '...', '...', '...', '...'],
                datasets: [{
                    label: 'Tâches / Pubs',
                    data: [0, 0, 0, 0, 0, 0, 0],
                    borderColor: '#00ffcc',
                    borderWidth: 3,
                    pointBackgroundColor: '#9b51e0',
                    pointBorderColor: '#ffffff',
                    pointHoverRadius: 6,
                    tension: 0.35,
                    fill: true,
                    backgroundColor: function(context) {
                        const chart = context.chart;
                        const {ctx, chartArea} = chart;
                        if (!chartArea) return null;
                        const gradient = ctx.createLinearGradient(0, chartArea.top, 0, chartArea.bottom);
                        gradient.addColorStop(0, 'rgba(0, 255, 204, 0.25)');
                        gradient.addColorStop(1, 'rgba(0, 255, 204, 0.0)');
                        return gradient;
                    }
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                animation: { duration: 800, easing: 'easeOutQuart' },
                plugins: { legend: { display: false } },
                scales: {
                    x: {
                        grid: { display: false },
                        ticks: { color: '#8e92bc', font: { size: 10 } }
                    },
                    y: {
                        beginAtZero: true,
                        grid: { color: 'rgba(255, 255, 255, 0.05)' },
                        ticks: { color: '#8e92bc', font: { size: 10 }, precision: 0 }
                    }
                }
            }
        });

        // 2. OUTIL POUR GÉNÉRER LES 7 DERNIERS JOURS AU FORMAT YYYY-MM-DD ET LABELS LUN/MAR...
        function getRolling7Days() {
            const keys = [];
            const labels = [];
            const daysMap = ['Dim', 'Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam'];

            for (let i = 6; i >= 0; i--) {
                const d = new Date();
                d.setDate(d.getDate() - i);

                const year = d.getFullYear();
                const month = String(d.getMonth() + 1).padStart(2, '0');
                const day = String(d.getDate()).padStart(2, '0');

                const dateKey = `${year}-${month}-${day}`;
                const labelName = i === 0 ? "Auj." : `${daysMap[d.getDay()]} ${day}/${month}`;

                keys.push(dateKey);
                labels.push(labelName);
            }
            return { keys, labels };
        }

        // 3. ÉCOUTE DE L'AUTHENTIFICATION & SYNCHRONISATION EN TEMPS RÉEL
        onAuthStateChanged(auth, (user) => {
            if (user) {
                // Écouter les modifications en direct sur rewards_users
                onSnapshot(doc(db, "rewards_users", user.uid), (docSnap) => {
                    if (docSnap.exists()) {
                        const data = docSnap.data();
                        updateDashboardUI(data);
                    }
                });
            } else {
                console.log("Utilisateur non connecté");
                document.getElementById('history-container').innerHTML = `
                    <div style="text-align:center; padding: 15px; color:#ff4d4d; font-size:12px;">Veuillez vous connecter pour voir vos statistiques.</div>
                `;
            }
        });

        // 4. MISE À JOUR DYNAMIQUE DE L'INTERFACE & DU GRAPHIQUE
        function updateDashboardUI(data) {
            // A. Données KPIs
            const totalCoins = data.coins || 0;
            const pointsDuJour = data.pointsDuJour || 0;
            const tasksCompleted = data.tasksCompleted || 0;
            const totalEuros = (totalCoins * RATE_PER_COIN).toFixed(2);

            document.getElementById('kpi-today-coins').innerText = `${pointsDuJour} Coins`;
            document.getElementById('kpi-total-earnings').innerText = `${totalEuros} €`;
            document.getElementById('kpi-coins-count').innerHTML = `<i class="fa-solid fa-coins"></i> ${totalCoins.toLocaleString()} Coins`;
            document.getElementById('kpi-tasks-completed').innerText = tasksCompleted;

            // B. Mise à jour du Graphique selon `history` (map YYYY-MM-DD)
            const historyMap = data.history || {};
            const rollingDays = getRolling7Days();
            const chartValues = rollingDays.keys.map(dateKey => historyMap[dateKey] || 0);

            earningsChart.data.labels = rollingDays.labels;
            earningsChart.data.datasets[0].data = chartValues;
            earningsChart.update();

            // C. Génération automatique du flux récents (Historique des dates de `history`)
            renderHistoryList(historyMap);
        }

        // 5. AFFICHAGE DES ACTIVITÉS RÉCENTES DEPUIS LE MAP `history`
        function renderHistoryList(historyMap) {
            const container = document.getElementById('history-container');
            const dates = Object.keys(historyMap).sort().reverse(); // Tri du plus récent au plus ancien

            if (dates.length === 0) {
                container.innerHTML = `<div style="text-align:center; padding: 15px; color:#6e729a; font-size:12px;">Aucune activité enregistrée.</div>`;
                return;
            }

            let html = '';
            // Prendre les 5 plus récents
            dates.slice(0, 5).forEach((dateStr) => {
                const count = historyMap[dateStr];
                const estimatedEarnings = (count * 10 * RATE_PER_COIN).toFixed(2); // Estimation
                
                // Formater la date en style lisible
                const parts = dateStr.split('-');
                const formattedDate = parts.length === 3 ? `${parts[2]}/${parts[1]}/${parts[0]}` : dateStr;

                html += `
                    <div class="history-item">
                        <div class="history-left">
                            <div class="icon-wrapper success"><i class="fa-solid fa-play"></i></div>
                            <div class="history-meta">
                                <h4>Session Pubs / Tâches</h4>
                                <span>${formattedDate}</span>
                            </div>
                        </div>
                        <div class="history-right">
                            <div class="history-amount">+${count} Tâche(s)</div>
                            <div class="history-coins">${count * 10} Coins estimés</div>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }
    </script>
</body>
</html>

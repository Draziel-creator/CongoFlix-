<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>PUBLICITÉ - Statistiques</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            font-family: 'Inter', sans-serif; background-color: #050508; color: #ffffff;
            overflow: hidden; display: flex; justify-content: center; align-items: center;
        }

        .app-container {
            width: 100%; height: 100%; max-width: 450px;
            background: linear-gradient(135deg, #060713 0%, #020308 100%);
            position: relative; display: flex; flex-direction: column;
            box-shadow: 0 0 40px rgba(0,0,0,0.8);
        }

        /* TOP HEADER */
        .stats-header {
            padding: 25px 20px 15px 20px;
            display: flex; align-items: center; justify-content: space-between;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        .btn-back {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #ffffff; width: 36px; height: 36px;
            border-radius: 50%; display: flex; justify-content: center; align-items: center;
            cursor: pointer; text-decoration: none; font-size: 14px;
        }
        .header-title { font-size: 18px; font-weight: 700; margin: 0; letter-spacing: -0.3px; }
        .header-spacer { width: 36px; }

        /* CORPS DEFILLANT */
        .scrollable-content {
            flex: 1; overflow-y: auto; padding: 20px; box-sizing: border-box;
        }
        .scrollable-content::-webkit-scrollbar { display: none; }

        /* GRILLE KPIs */
        .stats-grid {
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 25px;
        }
        .kpi-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px; padding: 16px; position: relative;
        }
        .kpi-icon { position: absolute; top: 16px; right: 16px; font-size: 16px; color: #555875; }
        .kpi-icon.coins { color: #ffcc00; }
        .kpi-label { font-size: 12px; color: #8e92bc; margin: 0 0 6px 0; }
        .kpi-value { font-size: 18px; font-weight: 700; margin: 0 0 6px 0; color: #ffffff; }
        .kpi-value.neon { color: #00ffcc; }
        .kpi-value.gold { color: #ffcc00; }
        .kpi-trend { font-size: 11px; font-weight: 600; display: flex; align-items: center; gap: 4px; }
        .trend-up { color: #00ff66; }
        .trend-neutral { color: #b3b6d4; }

        /* SECTION GRAPHIQUE */
        .chart-section {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 20px; padding: 20px; margin-bottom: 25px;
        }
        .section-heading {
            font-size: 13px; font-weight: 600; text-transform: uppercase;
            letter-spacing: 0.5px; color: #9b51e0; margin: 0 0 15px 0;
            display: flex; justify-content: space-between; align-items: center;
        }
        .time-filter {
            font-size: 11px; background: rgba(155, 81, 224, 0.15);
            color: #cca3ff; padding: 4px 10px; border-radius: 12px; font-weight: 700;
        }

        /* HISTORIQUE */
        .history-list { display: flex; flex-direction: column; gap: 10px; }
        .history-item {
            background: rgba(255, 255, 255, 0.01);
            border: 1px solid rgba(255, 255, 255, 0.03);
            border-radius: 14px; padding: 12px 16px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .history-left { display: flex; align-items: center; gap: 12px; }
        .icon-wrapper {
            width: 36px; height: 36px; border-radius: 10px;
            background: rgba(0, 85, 255, 0.1); color: #0055ff;
            display: flex; justify-content: center; align-items: center; font-size: 14px;
        }
        .icon-wrapper.success { background: rgba(0, 255, 204, 0.1); color: #00ffcc; }
        .history-meta h4 { margin: 0 0 2px 0; font-size: 13px; font-weight: 600; }
        .history-meta span { font-size: 11px; color: #6e729a; }
        .history-right { text-align: right; }
        .history-amount { font-size: 14px; font-weight: 700; color: #00ffcc; margin-bottom: 2px; }
        .history-coins { font-size: 11px; color: #ffcc00; font-weight: 500; }

       /* CONTAINER TRANSPARENT (AUCUN FOND RELIÉ) */
.nav-bar {
    position: fixed;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    width: calc(100% - 32px);
    max-width: 440px;
    background: transparent !important;
    border: none !important;
    padding: 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 1000;
    pointer-events: none; /* Rend la zone entre les boutons transparente aux clics */
}

/* BOUTONS CAPSULES FUTURISTES INDÉPENDANTS */
.nav-item {
    pointer-events: auto; /* Active le clic sur chaque bouton */
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    flex: 1;
    margin: 0 4px;
    padding: 10px 4px;
    color: #6e7293;
    text-decoration: none;
    font-size: 10px;
    font-weight: 600;
    border-radius: 16px; /* Forme rectangulaire arrondie / capsule */
    background: rgba(12, 16, 28, 0.75);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(255, 255, 255, 0.08);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

.nav-icon {
    font-size: 18px;
    transition: transform 0.3s ease;
}

/* EFFET HOVER (SURVOL) */
.nav-item:hover {
    transform: translateY(-3px);
    color: #ffffff;
    border-color: rgba(0, 255, 204, 0.3);
    box-shadow: 0 10px 20px rgba(0, 255, 204, 0.15);
}

/* BOUTON ACTIF AVEC PULSATION FUTURISTE */
.nav-item.active {
    color: #00ffcc;
    background: rgba(0, 255, 204, 0.08);
    border: 1px solid rgba(0, 255, 204, 0.6);
    animation: pulseFuturistic 2.2s infinite ease-in-out;
}

.nav-item.active .nav-icon {
    transform: scale(1.15);
    filter: drop-shadow(0 0 6px #00ffcc);
}

/* ANIMATION DE PULSATION NÉON */
@keyframes pulseFuturistic {
    0%, 100% {
        box-shadow: 0 0 12px rgba(0, 255, 204, 0.25), inset 0 0 8px rgba(0, 255, 204, 0.1);
        border-color: rgba(0, 255, 204, 0.5);
    }
    50% {
        box-shadow: 0 0 22px rgba(0, 255, 204, 0.55), inset 0 0 14px rgba(0, 255, 204, 0.25);
        border-color: rgba(0, 255, 204, 0.9);
        transform: translateY(-2px);
    }
}
    </style>
</head>
<body>

    <div class="app-container">

        <header class="stats-header">
            <div class="btn-back" onclick="history.back()"><i class="fa-solid fa-chevron-left"></i></div>
            <h1 class="header-title">Analytique</h1>
            <div class="header-spacer"></div>
        </header>

        <div class="scrollable-content">
            
            <div class="stats-grid">
                <div class="kpi-card">
                    <i class="fa-solid fa-coins kpi-icon coins"></i>
                    <p class="kpi-label">Points du jour</p>
                    <p class="kpi-value gold" id="kpi-today-coins">0 Pts</p>
                    <div class="kpi-trend trend-up">
                        <i class="fa-solid fa-bolt"></i> Aujourd'hui
                    </div>
                </div>

                <div class="kpi-card">
                    <i class="fa-solid fa-calculator kpi-icon"></i>
                    <p class="kpi-label">Valeur Taux</p>
                    <p class="kpi-value" style="font-size:15px;">50 000 = 50 $</p>
                    <div class="kpi-trend trend-neutral">
                        <i class="fa-solid fa-dollar-sign" style="color: #00ffcc;"></i> Taux USD
                    </div>
                </div>

                <div class="kpi-card">
                    <i class="fa-solid fa-wallet kpi-icon"></i>
                    <p class="kpi-label">Gains Totaux</p>
                    <p class="kpi-value neon" id="kpi-total-earnings">0,00 $</p>
                    <div class="kpi-trend trend-up" id="kpi-coins-count">
                        <i class="fa-solid fa-coins"></i> 0 Pts
                    </div>
                </div>

                <div class="kpi-card">
                    <i class="fa-solid fa-eye kpi-icon"></i>
                    <p class="kpi-label">Pubs Vues</p>
                    <p class="kpi-value" id="kpi-tasks-completed">0</p>
                    <div class="kpi-trend trend-neutral">
                        <i class="fa-solid fa-check"></i> Total accompli
                    </div>
                </div>
            </div>

            <div class="chart-section">
                <h3 class="section-heading">Activité Hebdomadaire <span class="time-filter">7 jours</span></h3>
                <div style="position: relative; height: 180px; width: 100%;">
                    <canvas id="earningsChart"></canvas>
                </div>
            </div>

            <div class="chart-section" style="padding-bottom: 10px;">
                <h3 class="section-heading">Flux Récents</h3>
                <div class="history-list" id="history-container">
                    <div style="text-align:center; padding: 15px; color:#555875; font-size:12px;">Chargement des données...</div>
                </div>
            </div>

        </div>

           <!-- NAV BAR -->
   <nav class="nav-bar">
    <a href="lancementpublicite.html" class="nav-item">
        <i class="fa-solid fa-house nav-icon"></i>
        <span>Accueil</span>
    </a>
    <a href="messages.html" class="nav-item">
        <i class="fa-regular fa-comment-dots nav-icon"></i>
        <span>Messages</span>
    </a>
    <a href="statpub.html" class="nav-item">
        <i class="fa-solid fa-chart-simple nav-icon"></i>
        <span>Stats</span>
    </a>
    <a href="activite.html" class="nav-item">
        <i class="fa-solid fa-bolt nav-icon"></i>
        <span>Activités</span>
    </a>
</nav>

    </div>

    <!-- SCRIPT FIREBASE & SYNCHRONISATION -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { 
            apiKey: "AIzaSyBAL9enbjp1vnv7h6yariu_sWvUp5QeRVQ",
            authDomain: "publicite-6445c.firebaseapp.com",
            projectId: "publicite-6445c",
            storageBucket: "publicite-6445c.firebasestorage.app",
            messagingSenderId: "663385244466",
            appId: "1:663385244466:web:b72a95c96a8e2b8e6bcd2b", 
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // TAUX DE CONVERSION : 50 000 Pts = 50 $  ==> 1 Pt = 0.001 $
        const RATE_PER_POINT = 50 / 50000; // 0.001 $

        // Stockage des états combinés des collections
        let stateData = {
            coins: 0,
            pointsDuJour: 0,
            tasksCompleted: 0,
            history: {}
        };

        // 1. INITIALISATION DU GRAPHIQUE CHART.JS DE DESIGN MODERNE
        const ctx = document.getElementById('earningsChart').getContext('2d');
        
        let gradientFill = ctx.createLinearGradient(0, 0, 0, 180);
        gradientFill.addColorStop(0, 'rgba(0, 255, 204, 0.35)');
        gradientFill.addColorStop(1, 'rgba(0, 255, 204, 0.0)');

        let earningsChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: ['...', '...', '...', '...', '...', '...', '...'],
                datasets: [{
                    label: 'Points gagnés',
                    data: [0, 0, 0, 0, 0, 0, 0],
                    borderColor: '#00ffcc',
                    borderWidth: 3,
                    pointBackgroundColor: '#9b51e0',
                    pointBorderColor: '#ffffff',
                    pointBorderWidth: 2,
                    pointRadius: 4,
                    pointHoverRadius: 7,
                    tension: 0.35, // Courbe fluide et moderne
                    fill: true,
                    backgroundColor: gradientFill
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                animation: { duration: 900, easing: 'easeOutQuart' },
                plugins: {
                    legend: { display: false },
                    tooltip: {
                        callbacks: {
                            label: function(context) {
                                return context.raw + ' Pts';
                            }
                        }
                    }
                },
                scales: {
                    x: {
                        grid: { display: false },
                        ticks: { color: '#8e92bc', font: { size: 10, family: 'Inter' } }
                    },
                    y: {
                        beginAtZero: true,
                        grid: { color: 'rgba(255, 255, 255, 0.04)' },
                        ticks: { color: '#8e92bc', font: { size: 10, family: 'Inter' }, precision: 0 }
                    }
                }
            }
        });

        // 2. OBTENIR LE CALENDRIER DES 7 DERNIERS JOURS (De j-6 jusqu'à aujourd'hui)
        function getRolling7Days() {
            const keys = [];
            const labels = [];
            const daysMap = ['Dim', 'Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam'];

            for (let i = 6; i >= 0; i--) {
                const d = new Date();
                d.setDate(d.getDate() - i);

                const year = d.getFullYear();
                const month = String(d.getMonth() + 1).padStart(2, '0');
                const day = String(d.getDate()).padStart(2, '0');

                const dateKey = `${year}-${month}-${day}`; // Format YYYY-MM-DD pour Firebase
                const labelName = i === 0 ? "Auj." : `${daysMap[d.getDay()]} ${day}/${month}`;

                keys.push(dateKey);
                labels.push(labelName);
            }
            return { keys, labels };
        }

        // 3. AUTHENTIFICATION ET ÉCOUTEURS DUAL-COLLECTION (users & rewards_users)
        onAuthStateChanged(auth, (user) => {
            if (user) {
                // A. Écouter la collection "rewards_users"
                onSnapshot(doc(db, "rewards_users", user.uid), (rewardsSnap) => {
                    if (rewardsSnap.exists()) {
                        const rData = rewardsSnap.data();
                        stateData.coins = rData.coins ?? stateData.coins;
                        stateData.tasksCompleted = rData.tasksCompleted ?? stateData.tasksCompleted;
                        stateData.history = rData.history ?? stateData.history;
                        
                        // Fallback pour pointsDuJour si présent dans rewards_users
                        if (rData.pointsDuJour !== undefined || rData.pointsDuJours !== undefined) {
                            stateData.pointsDuJour = rData.pointsDuJour ?? rData.pointsDuJours;
                        }

                        renderDashboardUI();
                    }
                });

                // B. Écouter la collection "users" pour intercepter `pointsDuJour` / `pointsDuJours`
                onSnapshot(doc(db, "users", user.uid), (userSnap) => {
                    if (userSnap.exists()) {
                        const uData = userSnap.data();
                        
                        // Vérifier si le champ est nommé pointsDuJour ou pointsDuJours
                        const valDuJour = uData.pointsDuJour ?? uData.pointsDuJours;
                        if (valDuJour !== undefined) {
                            stateData.pointsDuJour = valDuJour;
                            renderDashboardUI();
                        }
                    }
                });

            } else {
                document.getElementById('history-container').innerHTML = `
                    <div style="text-align:center; padding: 15px; color:#ff4d4d; font-size:12px;">Veuillez vous connecter pour voir vos statistiques.</div>
                `;
            }
        });

        // 4. METTRE À JOUR LE TABLEAU DE BORD & LE GRAPHIQUE
        function renderDashboardUI() {
            const totalCoins = stateData.coins || 0;
            const todayCoins = stateData.pointsDuJour || 0;
            const tasksCount = stateData.tasksCompleted || 0;
            
            // Calcul en DOLLARS : (Points * (50 / 50000))
            const totalDollars = (totalCoins * RATE_PER_POINT).toFixed(2);

            // Mise à jour des cartes KPI
            document.getElementById('kpi-today-coins').innerText = `${todayCoins.toLocaleString()} Pts`;
            document.getElementById('kpi-total-earnings').innerText = `${totalDollars} $`;
            document.getElementById('kpi-coins-count').innerHTML = `<i class="fa-solid fa-coins"></i> ${totalCoins.toLocaleString()} Pts`;
            document.getElementById('kpi-tasks-completed').innerText = tasksCount;

            // Mise à jour du graphique dynamique basé sur les 7 jours réels
            const rollingCalendar = getRolling7Days();
            const historyMap = stateData.history || {};

            // Si pour une date de la semaine il n'y a pas d'activité dans Firebase, la valeur est 0 (la courbe descend)
            const chartDataValues = rollingCalendar.keys.map(dateKey => {
                return historyMap[dateKey] || 0; 
            });

            earningsChart.data.labels = rollingCalendar.labels;
            earningsChart.data.datasets[0].data = chartDataValues;
            earningsChart.update();

            // Générer la liste du flux récent
            renderHistoryList(historyMap);
        }

        // 5. AFFICHAGE DES ACTIVITÉS RÉCENTES (PAR DATES FIREBASE)
        function renderHistoryList(historyMap) {
            const container = document.getElementById('history-container');
            const dates = Object.keys(historyMap).sort().reverse();

            if (dates.length === 0) {
                container.innerHTML = `<div style="text-align:center; padding: 15px; color:#6e729a; font-size:12px;">Aucune activité enregistrée.</div>`;
                return;
            }

            let html = '';
            dates.slice(0, 5).forEach((dateStr) => {
                const points = historyMap[dateStr];
                const dollarsEarned = (points * RATE_PER_POINT).toFixed(2);
                
                const parts = dateStr.split('-');
                const formattedDate = parts.length === 3 ? `${parts[2]}/${parts[1]}/${parts[0]}` : dateStr;

                html += `
                    <div class="history-item">
                        <div class="history-left">
                            <div class="icon-wrapper success"><i class="fa-solid fa-chart-line"></i></div>
                            <div class="history-meta">
                                <h4>Activité quotidienne</h4>
                                <span>${formattedDate}</span>
                            </div>
                        </div>
                        <div class="history-right">
                            <div class="history-amount">+${points.toLocaleString()} Pts</div>
                            <div class="history-coins">~ ${dollarsEarned} $</div>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }
    </script>
    <script>
document.addEventListener("DOMContentLoaded", () => {
    // Récupère le nom du fichier actuel (ex: "lancementpublicite.html")
    const currentPage = window.location.pathname.split("/").pop() || "lancementpublicite.html";
    const navItems = document.querySelectorAll('.nav-bar .nav-item');

    navItems.forEach(item => {
        const itemHref = item.getAttribute('href');

        // Compare le href du bouton avec la page actuelle
        if (itemHref === currentPage) {
            item.classList.add('active');
        } else {
            item.classList.remove('active');
        }
    });
});
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CongoFlix - Lancement</title>

  <!-- Étape 1 : Bibliothèque Adcash -->
  <script id="aclib" type="text/javascript" src="//acscdn.com/script/aclib.js"></script>

  <style>
    html, body {
      background-color: #000;
      margin: 0;
      padding: 0;
      overflow: hidden;
      height: 100%;
      font-family: sans-serif;
    }

    /* --- SPLASH ANIMATION INITIALE --- */
    #custom-splash { 
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%; 
      background: url('https://i.ibb.co/8LqBJJW3/file-00000000706471fd84451e9200d37cfb.png') center/cover no-repeat; 
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 25000; 
      transition: opacity 0.5s ease;
    }

    .logo-container { 
      width: 100px;
      height: 100px; 
      background: url('https://i.ibb.co/RpWsGk3D/IMG-20260416-WA0039.jpg') center/contain no-repeat; 
      border-radius: 20px; 
      box-shadow: 0 0 35px 10px rgba(255, 215, 0, 0.7); 
      animation: heartbeat 2s infinite ease-in-out; 
    }

    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }

    /* --- PAGE DE LANCEMENT PROPRE --- */
    #launch-page {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 24000;
    }

    .brand-title {
      color: #ffd700;
      margin: 0;
      letter-spacing: 2px;
      font-size: 26px;
    }

    .brand-sub {
      color: #fff;
      font-size: 13px;
      margin: 8px 0 35px 0;
      opacity: 0.8;
    }

    /* --- BOUTON DE REDIRECTION VERS L'APPLICATION --- */
    .btn-launch {
      padding: 16px 36px;
      border: 2px solid #ffd700;
      border-radius: 30px;
      background: #ffd700;
      color: #000;
      font-weight: bold;
      font-size: 16px;
      text-decoration: none;
      box-shadow: 0 0 25px rgba(255, 215, 0, 0.6);
      transition: transform 0.2s, background 0.2s;
    }

    .btn-launch:active {
      transform: scale(0.95);
    }
  </style>
</head>
<body>

  <!-- Étape 2 : Déclenchement automatique de l'interstitiel Adcash -->
  <script type="text/javascript">
    if (typeof aclib !== "undefined" && aclib.runInterstitial) {
      aclib.runInterstitial({
        zoneId: '12091866',
      });
    }
  </script>

  <!-- Splash Screen avec logo battant -->
  <div id="custom-splash">
    <div class="logo-container"></div>
  </div>

  <!-- Interface d'accueil avec le bouton de lancement -->
  <div id="launch-page">
    <h2 class="brand-title">CONGOFLIX</h2>
    <p class="brand-sub">LA VITRINE DE LA RDC</p>
    
    <a href="go:w1" class="btn-launch">CONTINUER VERS CONGOFLIX</a>
  </div>

  <script>
    // Disparition du splash screen après 2.5 secondes
    setTimeout(() => {
      const splash = document.getElementById('custom-splash');
      if (splash) {
        splash.style.opacity = '0';
        setTimeout(() => {
          splash.style.display = 'none';
        }, 500);
      }
    }, 2500);
  </script>

</body>
</html>

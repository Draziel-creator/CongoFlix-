<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vérification du compte - CongoFlix</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #060812;
            --card-bg: #0e1322;
            --card-border: #1a233a;
            --accent-green: #00ffaa;
            --accent-blue: #38bdf8;
            --text-muted: #94a3b8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }

        body {
            background-color: var(--bg-color);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .verify-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 40px 24px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
            animation: fadeIn 0.5s ease-out;
        }

        /* ANIMATION BOUNCE POUR LE STICKER */
        .sticker-box {
            font-size: 4rem;
            margin-bottom: 20px;
            display: inline-block;
            animation: floatSticker 2s infinite ease-in-out;
        }

        .badge-success {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 255, 170, 0.1);
            color: var(--accent-green);
            border: 1px solid rgba(0, 255, 170, 0.3);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 700;
            margin-bottom: 16px;
        }

        h1 { font-size: 1.6rem; font-weight: 800; margin-bottom: 12px; }
        p { font-size: 0.92rem; color: var(--text-muted); line-height: 1.6; margin-bottom: 24px; }

        .info-box {
            background: rgba(255, 255, 255, 0.03);
            border: 1px dashed var(--card-border);
            border-radius: 14px;
            padding: 14px;
            font-size: 0.82rem;
            color: #cbd5e1;
        }

        .spinner {
            font-size: 2.5rem;
            color: var(--accent-blue);
            animation: spin 1s linear infinite;
        }

        @keyframes floatSticker {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-10px) scale(1.08); }
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body>

    <div class="verify-card" id="status-card">
        <div class="spinner" id="loader"><i class="fa-solid fa-circle-notch"></i></div>
        <p id="loading-text" style="margin-top:15px;">Vérification de votre compte en cours...</p>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, applyActionCode } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = { 
            apiKey: "AIzaSyBAL9enbjp1vnv7h6yariu_sWvUp5QeRVQ",
            authDomain: "publicite-6445c.firebaseapp.com",
            projectId: "publicite-6445c",
            storageBucket: "publicite-6445c.firebasestorage.app",
            messagingSenderId: "663385244466",
            appId: "1:663385244466:web:b72a95c96a8e2b8e6bcd2b", 
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const card = document.getElementById('status-card');
        const urlParams = new URLSearchParams(window.location.search);
        const oobCode = urlParams.get('oobCode');

        if (oobCode) {
            applyActionCode(auth, oobCode)
                .then(() => {
                    // ÉCRAN DE SUCCÈS ANIME (SANS AUCUN BOUTON DE REDIRECTION)
                    card.innerHTML = `
                        <div class="sticker-box">🥳🎉</div>
                        <div class="badge-success">
                            <i class="fa-solid fa-check-circle"></i> VÉRIFICATION RÉUSSIE
                        </div>
                        <h1>Félicitations !</h1>
                        <p>Votre adresse e-mail a été confirmée avec succès.</p>
                        <div class="info-box">
                            <i class="fa-solid fa-mobile-screen-button" style="color:var(--accent-green);"></i><br><br>
                            Vous pouvez maintenant <strong>fermer cet onglet</strong> et retourner sur votre application pour poursuivre votre retrait.
                        </div>
                    `;
                })
                .catch((error) => {
                    card.innerHTML = `
                        <div class="sticker-box">⚠️</div>
                        <h1 style="color:#ff4d4d;">Lien invalide ou expiré</h1>
                        <p>Ce lien de vérification a déjà été utilisé ou est expiré.</p>
                        <div class="info-box">Fermez cet onglet et demandez un nouvel e-mail depuis l'application.</div>
                    `;
                });
        } else {
            card.innerHTML = `
                <div class="sticker-box">❓</div>
                <h1>Code manquant</h1>
                <p>Aucun code de vérification n'a été détecté.</p>
            `;
        }
    </script>
</body>
</html>
